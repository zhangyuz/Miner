[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketbreadth"
dynamic = ["version"]
description = "Market Breadth"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "jsmin",
    "mongoengine",
    "pydantic",
    "pymongo",
    "rich",
]

[tool.setuptools.dynamic]
version = { attr = "marketbreadth._version.version" }

[tool.setuptools.packages.find]
include = ["marketbreadth*"]
