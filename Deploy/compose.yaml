services:
  mongodb:
    image: mongo:8.0.5
    restart: unless-stopped
    container_name: miner-mongodb
    hostname: miner-mongodb
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - mongogo-db:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  redis:
    build: ./redis
    restart: unless-stopped
    hostname: miner-redis
    container_name: miner-redis
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    build: ./rabbitmq
    restart: unless-stopped
    container_name: miner-rabbitmq
    hostname: miner-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  browserscraper:
    build:
      context: ./browserscraper
      args:
        BASE_IMAGE: miner-base:latest
    restart: unless-stopped
    container_name: miner-browserscraper
    hostname: miner-browserscraper
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          memory: 1536M
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - RUNTIME_ENV=${RUNTIME_ENV}
    volumes:
      - miner-dev:/minerdev

  maintainer:
    build:
      context: ./maintainer
      args:
        BASE_IMAGE: miner-base:latest
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        GIT_USER_NAME: ${GIT_USER_NAME}
        GIT_USER_EMAIL: ${GIT_USER_EMAIL}
        RUNTIME_ENV: ${RUNTIME_ENV}
    restart: unless-stopped
    container_name: miner-maintainer
    hostname: miner-maintainer
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      - RUNTIME_ENV=${RUNTIME_ENV}
    volumes:
      - miner-dev:/minerdev

  ib-gateway:
    build:
      context: ./ib
      args:
        BASE_IMAGE: miner-base:latest
    restart: unless-stopped
    container_name: miner-ib-gateway
    hostname: miner-ib-gateway
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      TWS_SETTINGS_PATH: ${TWS_SETTINGS_PATH:-}
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-}
      READ_ONLY_API: ${READ_ONLY_API:-}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-exit}
      BYPASS_WARNING: ${BYPASS_WARNING:-}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-}
      AUTO_LOGOFF_TIME: ${AUTO_LOGOFF_TIME:-}
      TWS_COLD_RESTART: ${TWS_COLD_RESTART:-}
      SAVE_TWS_SETTINGS: ${SAVE_TWS_SETTINGS:-}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-no}
      TWOFA_EXIT_INTERVAL: ${TWOFA_EXIT_INTERVAL:-60}
      TWOFA_DEVICE: ${TWOFA_DEVICE:-}
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
      ALLOW_BLIND_TRADING: ${ALLOW_BLIND_TRADING:-no}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      TZ: ${TIME_ZONE:-Etc/UTC}
      CUSTOM_CONFIG: ${CUSTOM_CONFIG:-NO}
      JAVA_HEAP_SIZE: ${JAVA_HEAP_SIZE:-1024}
      SSH_TUNNEL: ${SSH_TUNNEL:-}
      SSH_OPTIONS: ${SSH_OPTIONS:-}
      SSH_ALIVE_INTERVAL: ${SSH_ALIVE_INTERVAL:-}
      SSH_ALIVE_COUNT: ${SSH_ALIVE_COUNT:-}
      SSH_PASSPHRASE: ${SSH_PASSPHRASE:-}
      SSH_REMOTE_PORT: ${SSH_REMOTE_PORT:-}
      SSH_USER_TUNNEL: ${SSH_USER_TUNNEL:-}
      SSH_RESTART: ${SSH_RESTART:-}
      SSH_VNC_PORT: ${SSH_VNC_PORT:-}
    ports:
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"

  trader:
    build:
      context: ./trader
      args:
        BASE_IMAGE: miner-base:latest
    restart: always
    container_name: miner-trader
    hostname: miner-trader
  #  depends_on:
  #    - ib
    volumes:
      - miner-dev:/minerdev

  miner:
    build:
      context: ./miner
      args:
        BASE_IMAGE: miner-base:latest
    restart: always
    container_name: minerservice
    hostname: miner-service
    mem_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      browserscraper:
        condition: service_started
      maintainer:
        condition: service_started
    ports:
      - "127.0.0.1:3080:80"
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:6666:6666"
      - "127.0.0.1:8001:8001"
    environment:
      - RUNTIME_ENV=${RUNTIME_ENV}
      - MAIL_SENDER=${MAIL_SENDER}
      - MAIL_SENDER_PWD=${MAIL_SENDER_PWD}
      - MAIL_RECEIVERS=${MAIL_RECEIVERS}
    privileged: true
    volumes:
      - miner-dev:/minerdev

  stkguru:
    build:
      context: ./stkguru
    restart: unless-stopped
    container_name: miner-stkguru
    hostname: miner-stkguru
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      miner:
        condition: service_started
    ports:
      - "127.0.0.1:80:80"

volumes:
  miner-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/../
  mongogo-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MINER_ROOT}/mongogo